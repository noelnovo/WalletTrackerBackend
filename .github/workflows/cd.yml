name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Request production deployment (also requires Jenkins approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wallettracker-production-cd
  cancel-in-progress: false

jobs:
  jenkins-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for skip-cd label
        id: check-label
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha
            });
            core.setOutput('skip', prs.data.some(pr => pr.labels.some(l => l.name === 'skip cd')));

      - name: Fetch Jenkins credentials from Vault
        if: steps.check-label.outputs.skip != 'true'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          method: jwt
          path: github-actions
          role: wallettracker-cd
          jwtGithubAudience: https://vault.downops.win
          secrets: |
            downops/data/services/jenkins/api JENKINS_API_TOKEN ;
            downops/data/services/jenkins/api JENKINS_HOSTNAME ;
            downops/data/services/jenkins/api JENKINS_USERNAME

      - name: Run Jenkins plan or approved deployment and verify its result
        if: steps.check-label.outputs.skip != 'true'
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
        run: python3 .github/scripts/jenkins_cd.py
