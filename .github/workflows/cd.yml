name: Request Jenkins CD plan

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Renewal-only Jenkins run, independent of source pushes; never applies TF.
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: wallettracker-production-cd
  cancel-in-progress: false

jobs:
  request-jenkins-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for skip-cd label
        id: check-label
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha
            });
            core.setOutput('skip', prs.data.some(pr => pr.labels.some(l => l.name === 'skip cd')));

      - name: Fetch scoped webhook credential from Vault
        if: steps.check-label.outputs.skip != 'true'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          method: jwt
          path: github-actions
          role: wallettracker-cd
          jwtGithubAudience: https://vault.downops.win
          secrets: |
            downops/data/services/jenkins/webhooks/instance-001 JENKINS_CD_SECRET

      # The public route exposes only Generic Webhook Trigger, not Jenkins APIs.
      # Success here means request accepted; the actual result is owned by Jenkins.
      # Production apply is requested/approved inside the internal Jenkins job.
      - name: Request Jenkins plan (not deployment result)
        if: steps.check-label.outputs.skip != 'true'
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          JENKINS_WEBHOOK_URL: https://jenkins.downops.win/generic-webhook-trigger/invoke
          REQUEST_ORIGIN: ${{ github.event_name == 'schedule' && 'credential-renewal' || 'github' }}
        run: python3 .github/scripts/jenkins_cd.py
