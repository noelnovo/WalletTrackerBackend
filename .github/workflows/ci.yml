name: CI

on:
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker compose down --volumes --remove-orphans || true

      - run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=adminadmin
          DATABASE_NAME=wallettracker
          WALLET_TRACKER_SECRET=secret
          WALLET_TRACKER_DB_USER=root
          WALLET_TRACKER_DB_HOST=db
          ENABLE_REGISTER=true
          COMPOSE_PROFILES=app, db
          EOF

      - run: docker compose up -d --build

      - run: docker compose exec -T app uv run pytest --cov=. --cov-report=xml --cov-report=term -v

      - run: docker compose cp app:/app/coverage.xml ./coverage.xml && sed -i 's|<source>/app</source>|<source>app</source>|g; s|<source>\.</source>|<source>app</source>|g' coverage.xml

      - run: head -100 coverage.xml

      - if: always()
        run: docker compose down --volumes

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-checks:
    runs-on: ubuntu-latest
    needs: [python-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Fetch secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            downops/data/wallettracker.backend SONAR_TOKEN ;
            downops/data/wallettracker.backend SONAR_HOST_URL ;
            downops/data/wallettracker.backend DT_URL ;
            downops/data/wallettracker.backend DT_API_KEY ;
            downops/data/wallettracker.backend DT_PROJECT_UUID ;
            downops/data/wallettracker.backend NVD_API_KEY

      - name: Generate SBOM with Syft
        run: |
          cd app
          # Regenerate lock file with current pyproject.toml to ensure accurate SBOM
          uv lock --upgrade
          cd ..
          
          # Scan app directory (includes uv.lock with correct dependency versions)
          docker run --rm -v "$(pwd):/workspace" anchore/syft dir:/workspace/app -o cyclonedx-json \
            | jq '.specVersion = "1.5" | ."$schema" = "http://cyclonedx.org/schema/bom-1.5.schema.json"' > bom.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

      - name: Submit SBOM to Dependency Track
        id: sbom
        continue-on-error: true
        run: |
          BODY_FILE=$(mktemp)
          jq -n --arg project "$DT_PROJECT_UUID" --rawfile bom bom.json \
            '{project: $project, bom: ($bom | @base64)}' > "$BODY_FILE"

          HTTP_RESPONSE=$(mktemp)
          echo "Submitting to: $DT_URL/api/v1/bom"
          echo "Project UUID: $DT_PROJECT_UUID"
          echo "SBOM file size: $(wc -c < bom.json) bytes"

          HTTP_STATUS=$(curl -sS --max-time 120 -X "PUT" "$DT_URL/api/v1/bom" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $DT_API_KEY" \
            -d @"$BODY_FILE" \
            -w "%{http_code}" \
            -o "$HTTP_RESPONSE") || true

          rm -f "$BODY_FILE"

          echo "HTTP Status: $HTTP_STATUS"
          echo "Full DT Response:"
          cat "$HTTP_RESPONSE"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ SBOM uploaded successfully"
            BOM_TOKEN=$(jq -r '.token' "$HTTP_RESPONSE" 2>/dev/null || echo "")
            if [ -z "$BOM_TOKEN" ] || [ "$BOM_TOKEN" = "null" ]; then
              echo "::warning::Response received but token extraction failed"
              echo "bom-token=" >> "$GITHUB_OUTPUT"
            else
              echo "✓ BOM Token: $BOM_TOKEN"
              echo "bom-token=$BOM_TOKEN" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Dependency Track returned HTTP $HTTP_STATUS"
            echo "bom-token=" >> "$GITHUB_OUTPUT"
          fi

          rm -f "$HTTP_RESPONSE"

      - name: Wait for Dependency Track Analysis
        id: dt-analysis
        continue-on-error: true
        run: |
          BOM_TOKEN="${{ steps.sbom.outputs.bom-token }}"

          if [ -z "$BOM_TOKEN" ]; then
            echo "::warning::No BOM token available, skipping analysis wait"
            exit 0
          fi

          echo "Waiting for Dependency Track analysis to complete (token: $BOM_TOKEN)..."
          MAX_ATTEMPTS=120
          ATTEMPT=0
          ANALYSIS_COMPLETE=false

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))

            RESPONSE=$(curl -sS -H "X-Api-Key: $DT_API_KEY" \
              "$DT_URL/api/v1/bom/token/$BOM_TOKEN/findings" 2>/dev/null || echo '{"error":"connection failed"}')

            if echo "$RESPONSE" | jq empty 2>/dev/null; then
              FINDING_COUNT=$(echo "$RESPONSE" | jq 'length')
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: analysis has returned $FINDING_COUNT findings"

              if [ "$FINDING_COUNT" -ge 0 ]; then
                echo "✓ Dependency Track analysis is available."
                if [ "$FINDING_COUNT" -eq 0 ]; then
                  echo "No vulnerabilities detected for this BOM."
                else
                  echo "$RESPONSE" | jq -r '.[] | "  - [\(.severity)] \(.component.name)@\(.component.version): \(.vulnerability.vulnId)"'
                fi
                ANALYSIS_COMPLETE=true
                break
              fi
            else
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Dependency Track not ready yet"
            fi

            sleep 5
          done

          if [ "$ANALYSIS_COMPLETE" = false ]; then
            echo "::warning::Dependency Track analysis did not complete within timeout. The SBOM has still been uploaded and SonarQube will continue using the latest available data."
          fi

      - run: ls -la coverage.xml && head -100 coverage.xml

      - name: SonarQube Analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 300

      # - name: OWASP Dependency Check
      #   continue-on-error: true
      #   run: |
      #     mkdir -p dependency-check-report
      #     docker run --rm \
      #       -v "$(pwd):/src" \
      #       -v "$(pwd)/dependency-check-report:/report" \
      #       owasp/dependency-check:12.2.2 \
      #       --scan /src/app/pyproject.toml \
      #       --enableExperimental \
      #       --project "wallet-tracker-api" \
      #       --format JSON \
      #       --out /report \
      #       --nvdApiKey "${{ env.NVD_API_KEY }}"
