name: security-checks

on:
  pull_request:
    branches: [main]

jobs:
  lockfile-check:
    runs-on: ubuntu-latest

    steps:
      # Enforce that app/uv.lock matches app/pyproject.toml. This job is
      # meant to be a required branch-protection check: it blocks merging
      # when the lock is stale, so developers get a clear message instead
      # of a confusing Docker/SBOM failure downstream.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Verify uv.lock is in sync
        run: |
          cd app
          if uv lock --check; then
            echo "uv.lock is in sync with pyproject.toml."
          else
            echo "::error::app/uv.lock is out of sync with app/pyproject.toml."
            echo "::error::Regenerate it locally and commit both files:"
            echo "::error::  git checkout ${{ github.head_ref }}"
            echo "::error::  cd app && uv lock"
            echo "::error::  git add pyproject.toml uv.lock && git commit -m \"Regenerate lock\" && git push"
            exit 1
          fi

  python-tests:
    runs-on: ubuntu-latest
    needs: [lockfile-check]

    steps:
      - uses: actions/checkout@v4

      - run: docker compose down --volumes --remove-orphans || true

      - run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=adminadmin
          DATABASE_NAME=wallettracker
          WALLET_TRACKER_SECRET=secret
          WALLET_TRACKER_DB_USER=root
          WALLET_TRACKER_DB_HOST=db
          ENABLE_REGISTER=true
          COMPOSE_PROFILES=app, db
          EOF

      - run: docker compose up -d --build

      - run: docker compose exec -T app uv run pytest --cov=. --cov-report=xml --cov-report=term -v

      - run: docker compose cp app:/app/coverage.xml ./coverage.xml && sed -i 's|<source>/app</source>|<source>app</source>|g; s|<source>\.</source>|<source>app</source>|g' coverage.xml

      - run: head -100 coverage.xml

      - if: always()
        run: docker compose down --volumes

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Product-specific: generate the CycloneDX SBOM and upload it as an artifact.
  # A .NET product would replace this job with its own generator (e.g.
  # cyclonedx-dotnet) and upload the same artifact name/filename; the generic
  # Dependency-Track workflow below is toolchain-agnostic.
  sbom:
    needs: [python-tests]
    runs-on: ubuntu-latest

    steps:
      # Check out the PR HEAD commit so the SBOM reflects exactly the
      # dependencies being merged, not the base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show PR dependency sources (debug)
        run: |
          echo "PR HEAD SHA: ${{ github.event.pull_request.head.sha }}"
          echo "--- app/pyproject.toml (jwt lines) ---"
          grep -in "jwt" app/pyproject.toml || true
          echo "--- app/uv.lock (pyjwt pin) ---"
          grep -B1 -A2 'name = "pyjwt"' app/uv.lock | head -20 || true

      - name: Generate CycloneDX SBOM with Syft
        run: |
          # Scan the checked-out PR source dir. Syft reads app/pyproject.toml
          # AND app/uv.lock as committed in this PR, so pinned versions in
          # uv.lock are what land in the SBOM. The lockfile-check job above
          # guarantees both files agree before this runs. Do NOT use
          # `uv lock --upgrade` or `syft packages pyproject:` here: the former
          # resolves >= ranges to newest (hiding vulns), the latter only sees
          # ranges instead of resolved versions.
          docker run --rm -v "$(pwd):/workspace" anchore/syft dir:/workspace/app -o cyclonedx-json \
            | jq '.specVersion = "1.5" | ."$schema" = "http://cyclonedx.org/schema/bom-1.5.schema.json"' > bom.json
          echo "--- SBOM jwt components (must match PR commit) ---"
          jq -c '.components[] | select(.name | test("jwt"; "i")) | {name, version, purl}' bom.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  # Generic, cross-repo: push the CycloneDX artifact to OWASP Dependency-Track
  # and wait for the analysis. Defined once in noelnovo/.github and reused by
  # every product; it does not generate the SBOM.
  #
  # The DT target is per-project: this repo sends its project UUID + API key
  # (repo variables/secret), and falls back to the Vault path when a value is
  # unset, so DT creds can stay in Vault if preferred.
  dependency-track:
    needs: [sbom]
    permissions:
      contents: read
    uses: noelnovo/.github/.github/workflows/dependency-track-scan.yml@main
    with:
      sbom-artifact-name: sbom
      sbom-filename: bom.json
      dt-url: ${{ vars.DT_URL }}
      dt-project-uuid: ${{ vars.DT_PROJECT_UUID }}
      vault-secret-path: downops/data/wallettracker.backend
    secrets:
      DT_API_KEY: ${{ secrets.DT_API_KEY }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

  # Product-specific: SonarQube analysis + quality gate. Runs only after the
  # Dependency-Track scan, because SonarQube's dependency-track plugin proxies
  # the live DT findings at scan time.
  sonarqube:
    runs-on: ubuntu-latest
    needs: [python-tests, dependency-track]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Fetch SonarQube secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            downops/data/wallettracker.backend SONAR_TOKEN ;
            downops/data/wallettracker.backend SONAR_HOST_URL

      - run: ls -la coverage.xml && head -100 coverage.xml

      - name: SonarQube Analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 300

  # Single, stable required check for branch protection: "security-checks".
  # It fans in the whole pipeline and fails if any security job failed or was
  # cancelled, so the PR rule only passes when everything is green.
  security-checks:
    name: security-checks
    if: always()
    needs: [lockfile-check, python-tests, sbom, dependency-track, sonarqube]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any security job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A security check failed — see the individual jobs above."
          exit 1
      - name: Confirm all security jobs passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All security checks passed."
