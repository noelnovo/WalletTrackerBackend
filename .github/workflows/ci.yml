name: CI

on:
  pull_request:
    branches: [main]

# Serialise runs that target the same Dependency-Track project. The SonarQube
# dependency-track plugin reads the *live* DT findings for the project, so two
# PRs running at once pollute each other (one PR's vulnerable BOM can fail the
# other PR's quality gate). Runs queue instead of cancelling.
concurrency:
  group: dt-scan-${{ vars.DT_PROJECT_UUID || github.repository }}
  cancel-in-progress: false

jobs:
  # ── lockfile / lint gate ────────────────────────────────────────────────────
  lockfile-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Verify uv.lock is in sync
        run: |
          cd app
          if uv lock --check; then
            echo "uv.lock is in sync with pyproject.toml."
          else
            echo "::error::app/uv.lock is out of sync with app/pyproject.toml."
            echo "::error::Regenerate it locally and commit both files:"
            echo "::error::  git checkout ${{ github.head_ref }}"
            echo "::error::  cd app && uv lock"
            echo "::error::  git add pyproject.toml uv.lock && git commit -m \"Regenerate lock\" && git push"
            exit 1
          fi

  # ── Python tests (separate from the security checks) ────────────────────────
  python-tests:
    runs-on: ubuntu-latest
    needs: [lockfile-check]

    steps:
      - uses: actions/checkout@v4

      - run: docker compose down --volumes --remove-orphans || true

      - run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=adminadmin
          DATABASE_NAME=wallettracker
          WALLET_TRACKER_SECRET=secret
          WALLET_TRACKER_DB_USER=root
          WALLET_TRACKER_DB_HOST=db
          ENABLE_REGISTER=true
          COMPOSE_PROFILES=app, db
          EOF

      - run: docker compose up -d --build

      - run: docker compose exec -T app uv run pytest --cov=. --cov-report=xml --cov-report=term -v

      - run: docker compose cp app:/app/coverage.xml ./coverage.xml && sed -i 's|<source>/app</source>|<source>app</source>|g; s|<source>\.</source>|<source>app</source>|g' coverage.xml

      - run: head -100 coverage.xml

      - if: always()
        run: docker compose down --volumes

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Security checks (separate from the Python tests) ────────────────────────

  # Product-specific: generate the CycloneDX SBOM and upload it as an artifact.
  # A .NET product would replace this job with its own generator (e.g.
  # cyclonedx-dotnet) and upload the same artifact name/filename; the generic
  # Dependency-Track workflow below is toolchain-agnostic.
  sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show PR dependency sources (debug)
        run: |
          echo "PR HEAD SHA: ${{ github.event.pull_request.head.sha }}"
          echo "--- app/pyproject.toml (jwt lines) ---"
          grep -in "jwt" app/pyproject.toml || true
          echo "--- app/uv.lock (pyjwt pin) ---"
          grep -B1 -A2 'name = "pyjwt"' app/uv.lock | head -20 || true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmariadb-dev pkg-config
          cd app
          uv sync --frozen

      - name: Generate CycloneDX SBOM with Syft (installed venv keeps licenses)
        run: |
          # NOTE: scanning the source dir / uv.lock yields components WITHOUT
          # licenses (uv.lock carries no license data: 60 comps, 0 licenses).
          # Scanning the installed venv instead lets Syft read each wheel's
          # METADATA (License-Expression), then we keep library components only
          # (a raw venv scan also lists files/binaries as components).
          docker run --rm -v "$(pwd):/workspace" anchore/syft dir:/workspace/app/.venv -o cyclonedx-json \
            | jq '.specVersion = "1.5" | ."$schema" = "http://cyclonedx.org/schema/bom-1.5.schema.json" | .components |= map(select(.type == "library"))' > bom-tmp.json
          echo "--- SBOM jwt components (must match PR commit) ---"
          jq -c '.components[] | select(.name | test("jwt"; "i")) | {name, version, purl, licenses}' bom-tmp.json || true

      - name: Enrich missing component licenses from PyPI
        run: |
          python3 - <<'PY'
          """Fill SBOM components missing `licenses` from PyPI metadata (stdlib only)."""
          import json
          import urllib.request

          # Trove classifier -> SPDX id. Only unambiguous mappings; anything else
          # falls back to the classifier text as a license *name* (never invent ids).
          CLASSIFIER_TO_SPDX = {
              "License :: OSI Approved :: MIT License": "MIT",
              "License :: OSI Approved :: ISC License (ISCL)": "ISC",
              "License :: OSI Approved :: Apache Software License": "Apache-2.0",
              "License :: OSI Approved :: BSD License": None,
              "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)": "MPL-2.0",
              "License :: OSI Approved :: Python Software Foundation License": "PSF-2.0",
              "License :: OSI Approved :: GNU General Public License (GPL)": None,
              "License :: OSI Approved :: GNU General Public License v2 (GPLv2)": "GPL-2.0-only",
              "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)": "GPL-2.0-or-later",
              "License :: OSI Approved :: GNU General Public License v3 (GPLv3)": "GPL-3.0-only",
              "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)": "GPL-3.0-or-later",
              "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)": "LGPL-2.0-only",
              "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)": "LGPL-2.0-or-later",
              "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)": "LGPL-3.0-only",
              "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)": "LGPL-3.0-or-later",
              "License :: OSI Approved :: Artistic License": "Artistic-2.0",
          }

          def pypi_info(name, version):
              url = "https://pypi.org/pypi/%s/%s/json" % (name, version)
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)["info"]

          def license_for(name, version):
              info = pypi_info(name, version)
              expr = (info.get("license_expression") or "").strip()
              if expr:
                  if " " not in expr and "/" not in expr:
                      return [{"license": {"id": expr}}]
                  return [{"expression": expr}]
              for classifier in info.get("classifiers") or []:
                  if classifier in CLASSIFIER_TO_SPDX:
                      spdx = CLASSIFIER_TO_SPDX[classifier]
                      if spdx:
                          return [{"license": {"id": spdx}}]
                      return [{"license": {"name": classifier.split("::")[-1].strip()}}]
              raw = (info.get("license") or "").strip()
              if raw and raw.upper() != "UNKNOWN":
                  return [{"license": {"name": raw}}]
              return None

          with open("bom-tmp.json") as handle:
              bom = json.load(handle)
          enriched, unresolved = 0, []
          for component in bom.get("components", []):
              if component.get("licenses"):
                  continue
              name = component.get("name")
              version = component.get("version")
              if not name or not version:
                  unresolved.append("%s@%s" % (name, version))
                  continue
              try:
                  licenses = license_for(name, version)
              except Exception as exc:
                  print("WARN: PyPI lookup failed for %s==%s: %s" % (name, version, exc))
                  unresolved.append("%s==%s" % (name, version))
                  continue
              if licenses:
                  component["licenses"] = licenses
                  enriched += 1
              else:
                  unresolved.append("%s==%s" % (name, version))
          with open("bom.json", "w") as handle:
              json.dump(bom, handle, indent=2)
              handle.write("\n")
          total = len(bom.get("components", []))
          with_licenses = sum(1 for c in bom["components"] if c.get("licenses"))
          print("components=%d with-licenses=%d enriched=%d unresolved=%s"
                % (total, with_licenses, enriched, unresolved or "none"))
          PY
          echo "--- SBOM license coverage ---"
          echo "components with licenses: $(jq '[.components[] | select(.licenses != null)] | length' bom.json)/$(jq '.components | length' bom.json)"
          echo "--- components still without licenses (should be none) ---"
          jq -c '.components[] | select(.licenses == null) | {name, version}' bom.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  # Generic, cross-repo: push the CycloneDX artifact to OWASP Dependency-Track
  # and wait for the analysis. Defined once in noelnovo/.github and reused by
  # every product; it does not generate the SBOM.
  dependency-track:
    needs: [sbom]
    permissions:
      contents: read
    uses: noelnovo/.github/.github/workflows/dependency-track-scan.yml@main
    with:
      sbom-artifact-name: sbom
      sbom-filename: bom.json
      dt-url: ${{ vars.DT_URL }}
      dt-project-uuid: ${{ vars.DT_PROJECT_UUID }}
      vault-secret-path: downops/data/wallettracker.backend
    secrets:
      DT_API_KEY: ${{ secrets.DT_API_KEY }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

  # Product-specific: SonarQube analysis + quality gate, after the DT scan.
  # This is the branch-protection required check.
  sonarqube:
    runs-on: ubuntu-latest
    needs: [python-tests, dependency-track]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Fetch SonarQube secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            downops/data/wallettracker.backend SONAR_TOKEN ;
            downops/data/wallettracker.backend SONAR_HOST_URL

      - run: ls -la coverage.xml && head -100 coverage.xml

      - name: SonarQube Analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 300
