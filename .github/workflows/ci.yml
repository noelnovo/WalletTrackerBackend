name: CI

on:
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker compose down --volumes --remove-orphans || true

      - run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=adminadmin
          DATABASE_NAME=wallettracker
          WALLET_TRACKER_SECRET=secret
          WALLET_TRACKER_DB_USER=root
          WALLET_TRACKER_DB_HOST=db
          ENABLE_REGISTER=true
          COMPOSE_PROFILES=app, db
          EOF

      - run: docker compose up -d --build

      - run: docker compose exec -T app uv run pytest --cov=. --cov-report=xml --cov-report=term -v

      - run: docker compose cp app:/app/coverage.xml ./coverage.xml && sed -i 's|<source>/app</source>|<source>app</source>|g; s|<source>\.</source>|<source>app</source>|g' coverage.xml

      - run: head -100 coverage.xml

      - if: always()
        run: docker compose down --volumes

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-checks:
    runs-on: ubuntu-latest
    needs: [python-tests]

    steps:
      # Check out the PR HEAD commit explicitly so the SBOM below reflects
      # exactly the dependencies being merged, not the base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Fetch secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            downops/data/wallettracker.backend SONAR_TOKEN ;
            downops/data/wallettracker.backend SONAR_HOST_URL ;
            downops/data/wallettracker.backend DT_URL ;
            downops/data/wallettracker.backend DT_API_KEY ;
            downops/data/wallettracker.backend DT_PROJECT_UUID ;
            downops/data/wallettracker.backend NVD_API_KEY

      - name: Show PR dependency sources (debug)
        run: |
          echo "PR HEAD SHA: ${{ github.event.pull_request.head.sha }}"
          echo "--- app/pyproject.toml (jwt lines) ---"
          grep -in "jwt" app/pyproject.toml || true
          echo "--- app/uv.lock (pyjwt pin) ---"
          grep -B1 -A2 'name = "pyjwt"' app/uv.lock | head -20 || true

      - name: Generate SBOM with Syft
        run: |
          # Scan the checked-out PR source dir. Syft reads app/pyproject.toml
          # AND app/uv.lock as committed in this PR, so pinned versions in
          # uv.lock are what land in the SBOM. Do NOT run `uv lock --upgrade`
          # here: it would resolve >= ranges to newest releases and hide the
          # vulnerable versions this gate is meant to catch. If pyproject.toml
          # and uv.lock disagree, `uv lock --check` below fails fast so the
          # author must commit a regenerated lock file.
          docker run --rm -v "$(pwd):/workspace" anchore/syft dir:/workspace/app -o cyclonedx-json \
            | jq '.specVersion = "1.5" | ."$schema" = "http://cyclonedx.org/schema/bom-1.5.schema.json"' > bom.json
          echo "--- SBOM jwt components (must match PR commit) ---"
          jq -c '.components[] | select(.name | test("jwt"; "i")) | {name, version, purl}' bom.json || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

      - name: Submit SBOM to Dependency Track
        id: sbom
        run: |
          BODY_FILE=$(mktemp)
          jq -n --arg project "$DT_PROJECT_UUID" --rawfile bom bom.json \
            '{project: $project, bom: ($bom | @base64)}' > "$BODY_FILE"
          HTTP_RESPONSE=$(mktemp)
          HTTP_STATUS=$(curl -sS --max-time 120 -X "PUT" "$DT_URL/api/v1/bom" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $DT_API_KEY" \
            -d @"$BODY_FILE" \
            -w "%{http_code}" \
            -o "$HTTP_RESPONSE") || true
          rm -f "$BODY_FILE"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Dependency Track returned HTTP $HTTP_STATUS"
            echo "Response:"
            cat "$HTTP_RESPONSE" || echo "(empty)"
            rm -f "$HTTP_RESPONSE"
            exit 1
          fi
          BOM_TOKEN=$(jq -r '.token' "$HTTP_RESPONSE" 2>/dev/null || echo "")
          rm -f "$HTTP_RESPONSE"
          if [ -z "$BOM_TOKEN" ] || [ "$BOM_TOKEN" = "null" ]; then
            echo "::error::Failed to extract BOM token from DT response"
            exit 1
          fi
          echo "SBOM uploaded, BOM token: $BOM_TOKEN"
          echo "bom-token=$BOM_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Wait for Dependency Track Analysis
        run: |
          # Dependency Track processes the BOM asynchronously. The SonarQube
          # dependency-track plugin proxies live DT findings at scan time, so
          # the Sonar analysis MUST run only after DT finishes analysing this
          # BOM - otherwise the quality gate evaluates stale vulnerabilities.
          BOM_TOKEN="${{ steps.sbom.outputs.bom-token }}"
          if [ -z "$BOM_TOKEN" ]; then
            echo "::error::No BOM token available, cannot wait for analysis"
            exit 1
          fi
          echo "Waiting for DT analysis (token: $BOM_TOKEN)..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS_JSON=$(curl -sS -H "X-Api-Key: $DT_API_KEY" \
              "$DT_URL/api/v1/bom/token/$BOM_TOKEN" 2>/dev/null || echo "")
            PROCESSING=$(echo "$STATUS_JSON" | jq -r '.processing // empty' 2>/dev/null || echo "")
            if [ "$PROCESSING" = "false" ]; then
              echo "DT analysis complete after $ATTEMPT attempt(s)."
              break
            fi
            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::DT analysis did not complete within timeout. Last response:"
              echo "$STATUS_JSON" || true
              exit 1
            fi
            sleep 5
          done
          echo "--- DT findings for project $DT_PROJECT_UUID ---"
          curl -sS -H "X-Api-Key: $DT_API_KEY" \
            "$DT_URL/api/v1/finding/project/$DT_PROJECT_UUID" \
            | jq -r '.[] | "- [\(.vulnerability.severity)] \(.component.name)@\(.component.version): \(.vulnerability.vulnId)"' \
            | head -50 || true

      - run: ls -la coverage.xml && head -100 coverage.xml

      - name: SonarQube Analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 300
