name: CI

on:
  pull_request:
    branches: [main]

# Runs targeting the same DT project must queue: the SonarQube DT plugin reads
# live DT findings, so parallel PRs would pollute each other's quality gate.
concurrency:
  group: dt-scan-${{ vars.DT_PROJECT_UUID || github.repository }}
  cancel-in-progress: false

jobs:
  delivery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 terraform/vault-agent/test_delivery.py
      - run: python3 -m unittest discover -s terraform -p 'test_*.py'

  lockfile-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Verify uv.lock is in sync
        run: |
          cd app
          if uv lock --check; then
            echo "uv.lock is in sync with pyproject.toml."
          else
            echo "::error::app/uv.lock is out of sync with app/pyproject.toml."
            echo "::error::Regenerate it locally and commit both files:"
            echo "::error::  git checkout ${{ github.head_ref }}"
            echo "::error::  cd app && uv lock"
            echo "::error::  git add pyproject.toml uv.lock && git commit -m \"Regenerate lock\" && git push"
            exit 1
          fi

  python-tests:
    runs-on: ubuntu-latest
    needs: [lockfile-check]

    steps:
      - uses: actions/checkout@v4

      - run: docker compose down --volumes --remove-orphans || true

      - run: |
          cat <<EOF > .env
          DATABASE_ROOT_PASSWORD=adminadmin
          DATABASE_NAME=wallettracker
          WALLET_TRACKER_SECRET=secret
          WALLET_TRACKER_DB_USER=root
          WALLET_TRACKER_DB_HOST=db
          ENABLE_REGISTER=true
          COMPOSE_PROFILES=app, db
          EOF

      - run: docker compose up -d --build

      - name: Exercise real main and tenant MariaDB migrations
        run: |
          docker compose exec -T -e DATABASE_NAME=wallettracker_migration_ci app uv run python - <<'PY'
          from sqlalchemy import inspect, text
          from migrate_all import main, get_engine

          main()
          engine = get_engine('wallettracker_migration_ci')
          with engine.begin() as connection:
              connection.execute(text('CREATE DATABASE IF NOT EXISTS wallettracker_migration_ci_u1'))
          engine.dispose()
          main()
          main()  # A repeated release must be idempotent.
          expected = {
              'wallettracker_migration_ci': {'User', 'RefreshToken', 'alembic_version'},
              'wallettracker_migration_ci_u1': {'Expense', 'ExpenseCategory', 'Importe', 'Season', 'alembic_version'},
          }
          for name, tables in expected.items():
              engine = get_engine(name)
              assert set(inspect(engine).get_table_names()) == tables
              engine.dispose()
          print('Real MariaDB main/tenant migrations and repeated upgrade verified')
          PY

      - run: docker compose exec -T app uv run pytest --cov=. --cov-report=xml --cov-report=term -v

      - run: docker compose cp app:/app/coverage.xml ./coverage.xml && sed -i 's|<source>/app</source>|<source>app</source>|g; s|<source>\.</source>|<source>app</source>|g' coverage.xml

      - run: head -100 coverage.xml

      - if: always()
        run: docker compose down --volumes

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show PR dependency sources (debug)
        run: |
          echo "PR HEAD SHA: ${{ github.event.pull_request.head.sha }}"
          echo "--- app/pyproject.toml (jwt lines) ---"
          grep -in "jwt" app/pyproject.toml || true
          echo "--- app/uv.lock (pyjwt pin) ---"
          grep -B1 -A2 'name = "pyjwt"' app/uv.lock | head -20 || true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmariadb-dev pkg-config
          cd app
          uv sync --frozen

      - name: Generate CycloneDX SBOM with Syft (installed venv keeps licenses)
        run: |
          # uv.lock carries no license data, so scanning the source dir yields
          # licenseless components; the installed venv lets Syft read each
          # wheel's METADATA instead. Keep libraries only: a raw venv scan
          # also lists files/binaries as components.
          docker run --rm -v "$(pwd):/workspace" anchore/syft dir:/workspace/app/.venv -o cyclonedx-json \
            | jq '.specVersion = "1.5" | ."$schema" = "http://cyclonedx.org/schema/bom-1.5.schema.json" | .components |= map(select(.type == "library"))' > bom.json
          echo "--- SBOM jwt components (must match PR commit) ---"
          jq -c '.components[] | select(.name | test("jwt"; "i")) | {name, version, purl, licenses}' bom.json || true
          echo "--- SBOM license coverage ---"
          echo "components with licenses: $(jq '[.components[] | select(.licenses != null)] | length' bom.json)/$(jq '.components | length' bom.json)"
          echo "--- components still without licenses ---"
          jq -c '.components[] | select(.licenses == null) | {name, version}' bom.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  dependency-track:
    needs: [sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Fetch scan settings using short-lived GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          method: jwt
          path: github-actions
          role: wallettracker-scan
          jwtGithubAudience: https://vault.downops.win
          secrets: |
            downops/data/services/dependency-track/clients/instance-001 DT_URL ;
            downops/data/services/dependency-track/clients/instance-001 DT_PROJECT_UUID ;
            downops/data/services/dependency-track/clients/instance-001 DT_API_KEY
      - name: Resolve Dependency-Track hostname
        run: |
          host="${DT_URL#https://}"
          host="${host%%/*}"
          echo "DT_HOST=$host" >> "$GITHUB_ENV"
      - name: Submit SBOM with the Dependency-Track maintained action
        id: upload
        uses: DependencyTrack/gh-upload-sbom@v4.3.0
        with:
          server-hostname: ${{ env.DT_HOST }}
          api-key: ${{ env.DT_API_KEY }}
          project: ${{ env.DT_PROJECT_UUID }}
          bom-filename: bom.json
      - name: Wait for SBOM analysis before SonarQube
        env:
          BOM_TOKEN: ${{ steps.upload.outputs.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            # Credentials go through stdin config, never curl argv or output.
            processing=$(printf 'header = "X-Api-Key: %s"\n' "$DT_API_KEY" | curl --config - -fsS --max-time 30 "$DT_URL/api/v1/bom/token/$BOM_TOKEN" | jq -r '.processing')
            if [ "$processing" = false ]; then
              echo 'Dependency-Track SBOM analysis completed'
              exit 0
            fi
            [ "$processing" = true ] || { echo 'Unexpected analysis status'; exit 1; }
            sleep 5
          done
          echo 'Dependency-Track analysis timed out'
          exit 1

  sonarqube:
    runs-on: ubuntu-latest
    needs: [python-tests, dependency-track]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Fetch SonarQube secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.downops.win
          method: jwt
          path: github-actions
          role: wallettracker-scan
          jwtGithubAudience: https://vault.downops.win
          secrets: |
            downops/data/services/sonarqube/clients/instance-001 SONAR_TOKEN ;
            downops/data/services/sonarqube/clients/instance-001 SONAR_HOST_URL

      - run: ls -la coverage.xml && head -100 coverage.xml

      - name: SonarQube Analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 300
