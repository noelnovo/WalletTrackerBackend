      - name: Generate SBOM with Syft
        run: |
          # Parse pyproject.toml directly to generate SBOM based on declared dependencies
          # not based on installed packages in the container
          docker run --rm -v "$(pwd):/workspace" anchore/syft packages pyproject:/workspace/app -o cyclonedx-json \
            | jq '.specVersion = "1.5" | ."$schema" = "http://cyclonedx.org/schema/bom-1.5.schema.json"' > bom.json
