[project]
name = "wallet-tracker-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "flask==2.2.5",
    "flask-sqlalchemy==2.5.1",
    "pyjwt==2.4.0",
    "mysqlclient==2.1.1",
    "cryptography==41.0.0",
    "requests==2.28.0",
    "flask-migrate==3.1.0",
    "waitress==2.1.2; sys_platform == 'win32'",
    "uwsgi==2.0.21; sys_platform != 'win32'",
    "idna==3.3",
    "urllib3==1.26.15",
    "mako==1.2.4",
    "msgpack==1.0.5",
]

[dependency-groups]
dev = [
    "pytest==7.4.0",
    "pytest-flask==1.2.0",
    "pytest-mock==3.11.1",
    "pytest-env==0.8.2",
    "pytest-cov==4.1.0",
    "pip-audit==2.6.2",
]

[tool.coverage.run]
relative_files = true
omit = ["tests/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
env_files = [".env"]
