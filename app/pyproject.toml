[project]
name = "wallet-tracker-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.0.3",
    "flask-sqlalchemy>=3.1.1",
    "pyjwt==2.10.1",
    "mysqlclient>=2.3.0",
    "cryptography==46.0.7",
    "requests==2.32.3",
    "flask-migrate>=4.1.0",
    "waitress>=3.0.2; sys_platform == 'win32'",
    "uwsgi>=2.0.31; sys_platform != 'win32'",
    "idna>=3.20",
    "urllib3==2.7.0",
    "mako>=1.4.3",
    "msgpack>=1.2.3",
    "jinja2==3.1.5",
    "werkzeug==3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
    "pytest-mock>=3.16.0",
    "pytest-env>=1.7.1",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]

[tool.setuptools]
packages = [
    "debugging",
    "endpoints",
    "exceptions",
    "migrations_main",
    "migrations_tenant",
    "models",
    "repositories",
    "utils",
    "validators",
]

[tool.coverage.run]
relative_files = true
omit = ["tests/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
env_files = [".env"]