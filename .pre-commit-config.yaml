repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check (app/)
        entry: bash -c 'cd app && uv lock --check'
        language: system
        pass_filenames: false
        files: ^app/(pyproject\.toml|uv\.lock)$
        description: Fail the commit/push when app/uv.lock is out of sync with app/pyproject.toml. Regenerate with `cd app && uv lock`.
