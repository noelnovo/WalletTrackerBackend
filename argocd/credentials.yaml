{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "wallettracker-credentials",
    "namespace": "argocd"
  },
  "spec": {
    "project": "wallettracker-credentials",
    "source": {
      "repoURL": "ssh://git@10.2.0.11:2222/downops/wallet-tracker-backend.git",
      "targetRevision": "main",
      "path": "k8s/credentials"
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "argocd"
    },
    "syncPolicy": {
      "automated": {
        "prune": false,
        "selfHeal": true
      }
    }
  }
}
