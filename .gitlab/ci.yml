stages: [test, image, security, publish]

workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[gitops /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "main" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
    - when: never

default:
  interruptible: true

variables:
  GIT_DEPTH: "0"
  DATABASE_ROOT_PASSWORD: "ci-only-not-production"
  DATABASE_NAME: "wallettracker_ci"
  WALLET_TRACKER_SECRET: "ci-only-signing-value"
  WALLET_TRACKER_DB_USER: "root"
  WALLET_TRACKER_DB_HOST: "db"
  ENABLE_REGISTER: "true"
  WALLET_TRACKER_STDOUT_LOG: "true"

delivery-tests:
  stage: test
  image: python:3.13-alpine
  script:
    - python3 -m devops.kubernetes.render_manifests --check
    - python3 -m unittest discover -s devops/tests -p 'test_*.py' -v
    - python3 -m devops.vault.bootstrap_vault

application-tests:
  stage: test
  image: python:3.12-alpine
  services:
    - name: mariadb:11.4.12
      alias: db
  variables:
    MARIADB_ROOT_PASSWORD: "ci-only-not-production"
  before_script:
    - apk add --no-cache mariadb-dev gcc musl-dev linux-headers
    - pip install --no-cache-dir uv
    - cd app && uv sync --frozen && uv lock --check && cd ..
  script:
    - PYTHONPATH="$CI_PROJECT_DIR/app" app/.venv/bin/python -m devops.database.real_migration_test
    - PYTHONPATH="$CI_PROJECT_DIR/app" app/.venv/bin/pytest tests --cov=app --cov-report=xml:coverage.xml -q
    - app/.venv/bin/python -c "import xml.etree.ElementTree as E; p='coverage.xml'; t=E.parse(p); [setattr(x,'text','app') for x in t.findall('./sources/source')]; t.write(p)"
  artifacts:
    paths: [coverage.xml]
    expire_in: 1 day

.docker:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache python3 jq git openssh-client

image-smoke:
  extends: .docker
  stage: image
  needs: [application-tests, delivery-tests]
  resource_group: wallettracker-build
  script:
    - docker build --build-arg BUILD_REVISION="$CI_COMMIT_SHA" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --label "org.opencontainers.image.version=$(cat VERSION)" -t wallettracker-ci app
    - python3 -m devops.ci.image_smoke
    - if [ "$CI_PIPELINE_SOURCE" != merge_request_event ]; then python3 -m devops.ci.package_image; fi
  artifacts:
    paths: [devops/artifacts/]
    expire_in: 1 day

security-gates:
  extends: .docker
  stage: security
  resource_group: wallettracker-security
  needs:
    - job: application-tests
      artifacts: true
    - job: image-smoke
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-ci-check\.[1-9][0-9]*)?$/)'
  script:
    - python3 -m devops.ci.package_image --verify
    - docker load -i devops/artifacts/backend-image.tar
    - cp devops/artifacts/backend-image.tar wallettracker-ci.tar
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace:ro" anchore/syft@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060 docker-archive:/workspace/wallettracker-ci.tar -o cyclonedx-json > bom.json
    - python3 -m devops.ci.security_scan

publish-dev:
  extends: .docker
  stage: publish
  interruptible: false
  resource_group: wallettracker-dev
  needs:
    - job: security-gates
    - job: image-smoke
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_COMMIT_REF_PROTECTED == "true"'
  environment:
    name: dev
    url: https://wallettracker-dev.int.downops.win
  script:
    - python3 -m devops.ci.publish dev

publish-prod:
  extends: .docker
  stage: publish
  interruptible: false
  resource_group: wallettracker-prod
  needs:
    - job: security-gates
    - job: image-smoke
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  environment:
    name: production
    url: https://api.downops.win
  script:
    - python3 -m devops.ci.publish prod
